name: Acceptance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/acceptance.sh

      # Результаты — в отдельную ветку, чтобы их можно было забрать через git.
      # Для main — ветка acceptance-results, для feat/x — acceptance-results-feat-x (параллельные прогоны не мешают).
      - name: Publish results
        if: always()
        run: |
          BR=acceptance-results
          [ "${{ github.ref_name }}" != main ] && BR="acceptance-results-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          mkdir -p results
          cd results
          git init -q -b "$BR"
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Acceptance ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" acceptance-results
