name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace --refresh-dependencies

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          GECKO=$(ls ~/.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview/geckoview/ | sort -V | tail -1)
          cp app/build/outputs/apk/debug/app-debug.apk "Os-Browser-${TAG}.apk"
          gh release create "$TAG" "Os-Browser-${TAG}.apk" \
            --title "ОсьBrowser, сборка ${{ github.run_number }}" \
            --notes "Движок GeckoView (Firefox) ${GECKO}. Автосборка из ${{ github.sha }}" --latest
