name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --refresh-dependencies 2>&1 | tee build.log

      # Ошибки компиляции — в аннотации, чтобы их было видно без полного лога.
      - name: Report errors
        if: failure()
        run: |
          # GitHub показывает не больше 10 аннотаций на шаг, поэтому склеиваем куски лога.
          { grep -E "^e: " build.log; grep -A25 "What went wrong" build.log; } | head -60 \
            | grep -v "^\s*$" | paste -sd'|' | fold -w 3500 | head -8 | while IFS= read -r chunk; do
            echo "::error::${chunk}"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          GECKO=$(ls ~/.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview/geckoview/ | sort -V | tail -1)
          cp app/build/outputs/apk/debug/app-debug.apk "Os-Browser-${TAG}.apk"
          gh release create "$TAG" "Os-Browser-${TAG}.apk" \
            --title "ОсьBrowser, сборка ${{ github.run_number }}" \
            --notes "Движок GeckoView (Firefox) ${GECKO}. Автосборка из ${{ github.sha }}" --latest
