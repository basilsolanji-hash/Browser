name: Build APK

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
            echo "OS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "OS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=личный ключ" >> "$GITHUB_ENV"
          else
            echo "SIGNING=тестовый ключ (задайте секрет KEYSTORE_PASSWORD)" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          set -o pipefail
          # APK — для установки напрямую; AAB (bundle) — для загрузки в Google Play.
          # Сначала модульные тесты (сотни случаев: переводы, адреса, ссылки, хранилища), потом сборка.
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon --refresh-dependencies 2>&1 | tee build.log

      # Итог модульных тестов — в сводку прогона (число случаев и провалов).
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot(); t += int(r.get('tests', 0)); f += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f"Модульные тесты: {t} случаев, провалов: {f}")
          PY
          # Тот же итог и список провалов — в ветку unit-results-<ветка>, чтобы забрать через git.
          BR="unit-results-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          mkdir -p unit && cd unit
          python3 - <<'PY' > summary.txt || true
          import glob, xml.etree.ElementTree as ET
          t = f = 0; bad = []
          for p in glob.glob('../app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot(); t += int(r.get('tests', 0))
              for c in r.iter('testcase'):
                  for x in list(c.findall('failure')) + list(c.findall('error')):
                      f += 1; bad.append(f"{c.get('classname')}.{c.get('name')}: {(x.get('message') or '')[:300]}")
          print(f"tests={t} failures={f}"); print("\n".join(bad))
          PY
          git init -q -b "$BR" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Unit tests ${{ github.run_number }} (${{ github.sha }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR" || true

      # Ошибки сборки — комментарием к коммиту, чтобы их было видно без полного лога.
      - name: Report errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: " build.log || true; grep -E "FAILED|AssertionError|expected:<" build.log | head -60 || true; grep -A40 "What went wrong" build.log || true; echo '```'; } > errors.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@errors.md > /dev/null

      # Тестовая сборка ветки feat/** по ручному запуску — пре-релиз со ссылкой на APK (не «последний» релиз).
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Os-Browser-${TAG}.apk"
          gh release create "$TAG" "Os-Browser-${TAG}.apk" --target "${{ github.sha }}" --prerelease --latest=false \
            --title "ОсьBrowser, тестовая сборка ${{ github.ref_name }} #${{ github.run_number }}" \
            --notes "Тестовая сборка ветки ${{ github.ref_name }} из ${{ github.sha }}. Подпись: ${SIGNING}."

      # Релиз — только из main; ветки feat/** лишь проверяют компиляцию.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          GECKO=$(ls ~/.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview/geckoview/ | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release.apk "Os-Browser-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Os-Browser-${TAG}.aab" 2>/dev/null || true
          gh release create "$TAG" "Os-Browser-${TAG}.apk" "Os-Browser-${TAG}.aab" \
            --title "ОсьBrowser, сборка ${{ github.run_number }}" \
            --notes "Движок GeckoView (Firefox) ${GECKO}. Подпись: ${SIGNING}. Автосборка из ${{ github.sha }}" --latest
