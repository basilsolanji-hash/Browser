name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "MultiBrowser-${TAG}.apk"
          gh release create "$TAG" "MultiBrowser-${TAG}.apk" \
            --title "Сборка ${{ github.run_number }}" \
            --notes "Автосборка из ${{ github.sha }}" --latest
