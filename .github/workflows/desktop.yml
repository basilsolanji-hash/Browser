name: Desktop (Windows)

# Сборка версии для Windows: типы и линтер → сборка → установщик NSIS.
# main — релиз desktop-<run>; ветки feat/desktop-* — пре-релиз (ссылка на установщик для проверки).
on:
  push:
    branches: [main, 'feat/desktop-**']
    paths: ['desktop/**', 'app/src/main/java/ru/multibrowser/Tr*.kt', '.github/workflows/desktop*.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and lint
        run: npm run check 2>&1 | tee check.log

      - name: Build
        run: npm run build

      - name: Installer
        run: npx electron-builder --win --publish never -c.extraMetadata.version=0.1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Os-Browser-Setup-0.1.${{ github.run_number }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/latest.yml

      # Ошибки проверки — комментарием к коммиту (логи jobs скачать нельзя).
      - name: Report errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -60 check.log 2>/dev/null || true; echo '```'; } > errors.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@errors.md > /dev/null

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/heads/feat/desktop')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-test-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ github.run_number }}"
          gh release create "$TAG" release/*.exe release/*.zip --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Ось Browser для Windows, тестовая сборка ${{ github.ref_name }} #${{ github.run_number }}" \
            --notes "Тестовая сборка ветки ${{ github.ref_name }} из ${{ github.sha }}. Установщик без подписи кода: Windows SmartScreen покажет предупреждение — «Подробнее» → «Выполнить в любом случае»."

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-${{ github.run_number }}"
          gh release create "$TAG" release/*.exe release/*.zip release/*.blockmap release/latest.yml --target "${{ github.sha }}" --latest=false \
            --title "Ось Browser для Windows, сборка ${{ github.run_number }}" \
            --notes "Движок Chromium (Electron $(node -p "require('electron/package.json').version")). Установщик без подписи кода: Windows SmartScreen покажет предупреждение — «Подробнее» → «Выполнить в любом случае». Автосборка из ${{ github.sha }}"

      # Постоянный релиз для автообновления: electron-updater читает desktop-latest/latest.yml.
      - name: Update desktop-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest > /dev/null 2>&1 || gh release create desktop-latest --target "${{ github.sha }}" --latest=false \
            --title "Ось Browser для Windows — последняя версия (автообновление)" \
            --notes "Служебный релиз для автообновления. Установщик последней сборки из main."
          # Старые установщики убираем, чтобы в релизе лежала только последняя версия.
          # В пустом релизе grep ничего не находит — это не ошибка.
          { gh release view desktop-latest --json assets -q '.assets[].name' | grep -E '\.(exe|zip|blockmap)$' || true; } | while read -r f; do
            gh release delete-asset desktop-latest "$f" -y
          done
          gh release upload desktop-latest release/*.exe release/*.zip release/*.blockmap release/latest.yml --clobber

      # Письмо со ссылками на новую сборку — только если заданы секреты Gmail (иначе шаг молча пропускается).
      # DESKTOP_MAIL_USER — адрес Gmail отправителя, DESKTOP_MAIL_PASSWORD — «пароль приложения» Google.
      - name: Mail release links
        if: github.ref == 'refs/heads/main'
        env:
          MAIL_USER: ${{ secrets.DESKTOP_MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.DESKTOP_MAIL_PASSWORD }}
          MAIL_TO: BasilSolanji@Gmail.com
          VERSION: 0.1.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASSWORD" ]; then echo "Gmail secrets are not set — skipping"; exit 0; fi
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          v, repo = os.environ["VERSION"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/desktop-latest"
          msg = EmailMessage()
          msg["Subject"] = f"Ось Browser для Windows {v} — новая сборка"
          msg["From"] = os.environ["MAIL_USER"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content(
              f"Новая сборка Ось Browser для Windows: {v}\n\n"
              f"Портативная версия (без установки):\n{base}/Os-Browser-Portable-{v}.zip\n\n"
              f"Установщик:\n{base}/Os-Browser-Setup-{v}.exe\n\n"
              f"Все файлы: https://github.com/{repo}/releases/tag/desktop-latest\n\n"
              "Программа пока без подписи кода: если Windows SmartScreen предупреждает — «Подробнее» → "
              "«Выполнить в любом случае»; если пропал Os Browser.exe — восстановите его в журнале защиты антивируса.\n")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["MAIL_USER"], os.environ["MAIL_PASSWORD"])
              s.send_message(msg)
          print("mail sent")
          PY
