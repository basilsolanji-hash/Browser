name: Desktop (Windows)

# Сборка версии для Windows: типы и линтер → сборка → установщик NSIS.
# main — релиз desktop-<run>; ветки feat/desktop-* — пре-релиз (ссылка на установщик для проверки).
on:
  push:
    branches: [main, 'feat/desktop-**']
    paths: ['desktop/**', 'app/src/main/java/ru/multibrowser/Tr*.kt', '.github/workflows/desktop*.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and lint
        run: npm run check 2>&1 | tee check.log

      - name: Build
        run: npm run build

      - name: Installer
        run: npx electron-builder --win nsis --publish never -c.extraMetadata.version=0.1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Os-Browser-Setup-0.1.${{ github.run_number }}
          path: desktop/release/*.exe

      # Ошибки проверки — комментарием к коммиту (логи jobs скачать нельзя).
      - name: Report errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -60 check.log 2>/dev/null || true; echo '```'; } > errors.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@errors.md > /dev/null

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/heads/feat/desktop')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-test-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ github.run_number }}"
          gh release create "$TAG" release/*.exe --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Ось Browser для Windows, тестовая сборка ${{ github.ref_name }} #${{ github.run_number }}" \
            --notes "Тестовая сборка ветки ${{ github.ref_name }} из ${{ github.sha }}. Установщик без подписи кода: Windows SmartScreen покажет предупреждение — «Подробнее» → «Выполнить в любом случае»."

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-${{ github.run_number }}"
          gh release create "$TAG" release/*.exe --target "${{ github.sha }}" --latest=false \
            --title "Ось Browser для Windows, сборка ${{ github.run_number }}" \
            --notes "Движок Chromium (Electron $(node -p "require('electron/package.json').version")). Установщик без подписи кода: Windows SmartScreen покажет предупреждение — «Подробнее» → «Выполнить в любом случае». Автосборка из ${{ github.sha }}"
