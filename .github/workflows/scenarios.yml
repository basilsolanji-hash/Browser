name: Scenarios

# Матрица сценариев на эмуляторе: 4 части параллельно (языки, темы и адресная строка,
# популярные сайты, ссылки/cookies/скачивание/поворот/меню). Результаты каждой части —
# в ветку scenario-results-<ветка>-<часть>.
on:
  workflow_dispatch:
  # Запуск из любой ветки: git push origin HEAD:test/scenarios
  push:
    branches: ['test/scenarios']

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/scenarios.sh ${{ matrix.shard }}

      - name: Publish results
        if: always()
        run: |
          BR="scenario-results-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ matrix.shard }}"
          mkdir -p results
          cd results
          git init -q -b "$BR"
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "Scenarios ${{ github.run_number }} part ${{ matrix.shard }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"
