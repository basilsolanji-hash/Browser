name: Site

# Сайт пересобирается при правке исходников, переводов приложения (строки берутся из Tr*.kt
# через gen-i18n.mjs) и после каждого успешного релиза — ссылки на скачивание и журнал
# изменений берутся из GitHub Releases на этапе сборки (§2 ТЗ).
on:
  # Ветки feat/site-*: только сборка и проверки, без публикации (см. условие deploy).
  # Фильтр путей общий для обеих — у push может быть только один набор фильтров.
  push:
    branches: [main, 'feat/site-*']
    paths:
      - 'site/**'
      - 'app/src/main/java/ru/multibrowser/Tr*.kt'
      - 'desktop/scripts/gen-i18n.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build APK', 'Desktop (Windows)']
    types: [completed]
    branches: [main]

permissions:
  contents: write # пуш результатов в ветку site-results

# Публикацию не прерываем на середине: следующий прогон дождётся текущего.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    # После релиза — только если сам релиз собрался.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Chromium нужен и для OG-картинок, и для приёмки, и для Lighthouse — ставим один раз.
      - run: npx playwright install --with-deps chromium

      - name: Prepare (fonts, app strings)
        run: node scripts/prepare.mjs

      - name: Fetch releases
        run: node scripts/fetch-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: 'true'

      - name: OG images
        run: node scripts/og.mjs

      - run: npm run build

      # Проверки не останавливают друг друга: важно получить все результаты разом,
      # а упасть — в самом конце, после публикации отчётов.
      - name: Acceptance (Playwright, axe, budgets)
        id: acceptance
        continue-on-error: true
        run: node test/acceptance.mjs

      - name: Lighthouse CI
        id: lhci
        continue-on-error: true
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lhci autorun

      # lychee проверяет файлы, а ссылки на сайте абсолютные (/ru/… или /Browser/…): кладём dist
      # под тем же путём в _lychee и даём корень _lychee. Канонические адреса сайта сводим к тем же
      # файлам — так проверяется то, что будет выложено, а не прошлая версия.
      # Адрес и базовый путь сайта — из links.json, как при сборке (scripts/site-config.mjs).
      - name: Site address
        run: node --input-type=module -e "import { SITE, BASE } from './scripts/site-config.mjs'; console.log('SITE=' + SITE + '\nBASE=' + BASE)" >> "$GITHUB_ENV"

      - name: Stage dist for link check
        run: rm -rf ../_lychee && mkdir -p "../_lychee$BASE" && cp -r dist/. "../_lychee$BASE/"

      - name: Link check (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          jobSummary: true
          output: site/lychee-report.md
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_lychee
            --index-files index.html
            --accept 200,429
            --max-concurrency 8
            --remap '${{ env.SITE }}${{ env.BASE }} file://${{ github.workspace }}/_lychee${{ env.BASE }}'
            '_lychee/**/*.html'

      # Результаты — в отдельную ветку, как у Android-приёмки: site-results для main,
      # site-results-feat-x для веток (параллельные прогоны не мешают друг другу).
      - name: Publish results
        if: always()
        run: |
          BR=site-results
          [ "${{ github.ref_name }}" != main ] && BR="site-results-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          rm -rf ../results && mkdir -p ../results
          [ -d test-results ] && cp -r test-results ../results/
          [ -d lhci-reports ] && cp -r lhci-reports ../results/lighthouse
          [ -f lychee-report.md ] && cp lychee-report.md ../results/
          cat > ../results/summary.txt <<EOF
          run: ${{ github.run_number }} (${{ github.sha }})
          acceptance: ${{ steps.acceptance.outcome }}
          lighthouse: ${{ steps.lhci.outcome }}
          lychee: ${{ steps.lychee.outcome }}
          EOF
          cd ../results
          git init -q -b "$BR"
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Site ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"

      - name: Fail if any check failed
        if: steps.acceptance.outcome == 'failure' || steps.lhci.outcome == 'failure' || steps.lychee.outcome == 'failure'
        run: |
          echo "acceptance=${{ steps.acceptance.outcome }} lighthouse=${{ steps.lhci.outcome }} lychee=${{ steps.lychee.outcome }}"
          exit 1

      # Выкладка на хостинг Beget по FTP — только из main и только когда заданы секреты
      # BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD (BEGET_FTP_DIR — папка сайта на хостинге).
      # Служебные папки хостинга (cgi-bin, проверка сертификата .well-known/acme-challenge) не трогаем.
      - name: Deploy to Beget
        id: deploy
        if: github.ref == 'refs/heads/main'
        env:
          HOST: ${{ secrets.BEGET_FTP_HOST }}
          USER: ${{ secrets.BEGET_FTP_USER }}
          PASS: ${{ secrets.BEGET_FTP_PASSWORD }}
          DIR: ${{ secrets.BEGET_FTP_DIR }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::warning::Нет секретов BEGET_FTP_* — сайт собран и проверен, но не выложен."
            exit 0
          fi
          sudo apt-get install -y -q lftp > /dev/null
          # Сертификат FTP у Beget выдан на имя сервера, а не на адрес аккаунта: шифруем, но имя не сверяем.
          lftp -u "$USER,$PASS" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; \
            mirror --reverse --delete --parallel=4 --exclude-glob cgi-bin/ --exclude-glob .well-known/acme-challenge/ dist/ ${DIR:-os-browser.com/public_html}/; quit" "$HOST"
          echo "deployed=1" >> "$GITHUB_OUTPUT"

      # Живой сайт после выкладки: страницы открываются, версия совпадает со сборкой, заголовки на месте.
      - name: Check live site
        if: steps.deploy.outputs.deployed == '1'
        run: |
          sleep 10
          VER=$(node -p "require('./src/data/releases.json').android.latest.version")
          curl -fsS "$SITE/ru/download/" | grep -q "$VER" || { echo "::error::На $SITE/ru/download/ нет версии $VER"; exit 1; }
          curl -fsSI "$SITE/" | tee /tmp/h.txt | head -20
          grep -qi '^content-security-policy:' /tmp/h.txt || echo "::warning::Нет заголовка CSP — проверьте, что .htaccess выложен"
          curl -fsS -o /dev/null "$SITE/privacy.html"
          for u in "http://os-browser.com/" "https://os-browser.com/"; do
            curl -sSI "$u" | grep -i '^location:' || echo "::warning::$u не переадресует на www"
          done
