name: Store screenshots

# Скриншоты для Google Play: git push -f origin HEAD:test/store-shots
on:
  push:
    branches: [test/store-shots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_6, pixel_tablet]
        langs: ["ru en es", "pt fr de", "ar hi tr zh", "be uz ky", "tg kk hy"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: LANGS="${{ matrix.langs }}" bash .github/scripts/store_shots.sh
      - name: Publish results
        if: always()
        run: |
          BR="store-shots-results-${{ matrix.device }}-$(echo '${{ matrix.langs }}' | tr ' ' '-')"
          mkdir -p results
          cd results
          git init -q -b "$BR"
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Store shots ${{ github.run_number }} ${{ matrix.device }} ${{ matrix.langs }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"
