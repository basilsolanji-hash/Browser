# Сборка установщика Windows (NSIS). Подписи кода пока нет (§9 ТЗ) — SmartScreen будет предупреждать.
appId: ru.multibrowser.desktop
productName: Os Browser
copyright: Ось Browser
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
asar: true
# latest.yml для автообновления (electron-updater): постоянный релиз desktop-latest, только HTTPS.
publish:
  provider: generic
  url: https://github.com/basilsolanji-hash/Browser/releases/download/desktop-latest
# Безопасность сборки: без запуска как Node, без NODE_OPTIONS и --inspect, cookies шифруются, код только из asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  # Установщик и портативная версия (zip: распаковать и запустить, без установки и ярлыков).
  target: [nsis, zip]
  icon: assets/icon.ico
  # Имя для zip; у установщика своё — в разделе nsis.
  artifactName: Os-Browser-Portable-${version}.${ext}
nsis:
  artifactName: Os-Browser-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ось Browser
  uninstallDisplayName: Ось Browser
  deleteAppDataOnUninstall: false
  include: assets/installer.nsh
  # Значок Оси на установщике и деинсталляторе (а не стандартный значок NSIS).
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
