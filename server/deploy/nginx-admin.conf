# Include at server{} level inside the existing HTTPS virtual host.
# Replace existing logging targets first; multiple error_log directives on one level all remain active.
# Discard request logging at vhost level too: malformed requests can fail before location selection.
# Nginx error lines may contain client IP and URI; do not send them to a file or syslog.
access_log off;
error_log /dev/null;
location = /admin {
    access_log off;
    error_log /dev/null;
    return 308 /admin/;
}
location /admin/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 2k;
    proxy_read_timeout 15s;
    access_log off;
    error_log /dev/null;
}
