<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ось Browser</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head>
<body><header><a class="brand" href="/admin/"><span class="mark" aria-hidden="true">О</span><span>Ось Browser</span></a><label class="language"><span data-t="language"></span><select id="language"></select></label></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="login" class="login" hidden><span class="eyebrow">Ось Browser</span><h1 data-t="title"></h1><form id="login-form"><label for="token" data-t="auth"></label><input id="token" name="token" type="password" autocomplete="current-password" required maxlength="128"><button type="submit" data-t="sign_in"></button></form></section>
<div id="dashboard" class="shell" hidden><aside><h1 data-t="title"></h1><nav><a href="#service" data-t="service"></a><a href="#usage" data-t="usage"></a></nav><button id="logout" class="quiet" data-t="sign_out"></button></aside>
<main><section id="service"><div class="section-heading"><h2 data-t="service"></h2><button id="refresh" class="quiet" data-t="refresh"></button></div><p id="connection" class="muted" data-t="not_connected" hidden></p><div class="cards">
<article><span data-t="users"></span><strong id="users">—</strong></article><article><span data-t="devices"></span><strong id="devices">—</strong></article><article><span data-t="storageBytes"></span><strong id="storageBytes">—</strong></article><article><span data-t="syncErrors"></span><strong id="syncErrors">—</strong></article></div></section>
<section id="usage" class="usage"><h2 data-t="usage"></h2><form id="period"><label><span data-t="from"></span><input type="date" id="since" required></label><label><span data-t="to"></span><input type="date" id="until" required></label><button type="submit" data-t="refresh"></button></form><p class="muted" data-t="small"></p><p id="empty" class="empty" data-t="empty"></p><div class="table-wrap" id="usage-table" hidden><table><thead><tr><th data-t="usage"></th><th>Android</th><th>Windows</th><th data-t="actions"></th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div></body></html>
